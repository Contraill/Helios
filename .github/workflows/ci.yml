name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - name: Notify Vercel
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - helios: quality"

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node node_modules/next/dist/bin/next build --webpack

  e2e-chromium:
    name: Playwright Chromium full
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:chromium

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7

  cross-browser:
    name: Cross-browser / ${{ matrix.project }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome-release
            browser: chrome
          - project: firefox-release
            browser: firefox
          - project: webkit-release
            browser: webkit
          - project: edge-release
            browser: msedge
          - project: android-chrome-release
            browser: chromium
          - project: ios-safari-release
            browser: webkit
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright managed browser
        if: ${{ matrix.browser != 'chrome' && matrix.browser != 'msedge' }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install Chromium channel dependencies
        if: ${{ matrix.browser == 'chrome' || matrix.browser == 'msedge' }}
        run: pnpm exec playwright install-deps chromium

      - name: Install Google Chrome
        if: ${{ matrix.browser == 'chrome' }}
        run: pnpm exec playwright install chrome

      - name: Install Microsoft Edge
        if: ${{ matrix.browser == 'msedge' }}
        run: pnpm exec playwright install msedge

      - run: pnpm exec playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  e2e-gate:
    name: Playwright smoke
    if: ${{ always() }}
    needs:
      - e2e-chromium
      - cross-browser
    runs-on: ubuntu-latest
    steps:
      - name: Notify Vercel
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - helios: e2e"

      - name: Require Chromium and cross-browser suites
        env:
          CHROMIUM_RESULT: ${{ needs.e2e-chromium.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: |
          echo "Chromium: $CHROMIUM_RESULT"
          echo "Cross-browser: $CROSS_BROWSER_RESULT"
          test "$CHROMIUM_RESULT" = "success"
          test "$CROSS_BROWSER_RESULT" = "success"
